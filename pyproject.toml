[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aep"
version = "0.1.0"
description = "Helpers to call the Adobe Experience Platform REST APIs and Query Service from Python"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "psycopg2-binary>=2.9",
    "pandas>=2.2",
]

[tool.setuptools]
packages = ["aep"]
